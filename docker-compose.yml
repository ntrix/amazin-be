services:
  amazin-be:
    build: .
    # Reads PORT from .env and maps it 1:1 - the app listens on whatever
    # PORT says, not a hardcoded 5000, so a mismatched mapping (e.g. when
    # PORT was changed locally to dodge a port conflict) silently drops
    # every request with "connection reset".
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    # Overrides .env's REDIS_URL - "localhost" inside this container is the
    # container itself, not the sibling "redis" container, so the compose
    # service's own hostname has to be used instead.
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
